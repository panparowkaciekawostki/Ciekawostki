<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Pan Parówka</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: "Comic Sans MS", Arial, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background: linear-gradient(135deg, #ff8e53, #ff2d55);
            animation: bgShift 10s infinite alternate ease-in-out;
        }

        @keyframes bgShift {
            0% { background: linear-gradient(135deg, #ff8e53, #ff2d55); }
            100% { background: linear-gradient(135deg, #ffcd3c, #ff5733); }
        }

        .card {
            text-align: center;
            padding: 40px;
            width: 90%;
            max-width: 420px;
            background: white;
            border-radius: 20px;
            box-shadow: 0 0 25px rgba(255, 255, 255, 0.5);
            animation: float 3s infinite ease-in-out;
        }

        @keyframes float {
            0% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
            100% { transform: translateY(0); }
        }

        h1 {
            font-size: 36px;
            margin-bottom: 10px;
            color: #ff2d55;
            text-shadow: 2px 2px 0 #fff000;
        }

        p {
            font-size: 18px;
            line-height: 1.4;
        }

        a {
            display: inline-block;
            margin-top: 25px;
            padding: 14px 30px;
            font-size: 20px;
            text-decoration: none;
            background: #ff2d55;
            color: white;
            border-radius: 12px;
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.8);
            animation: glow 2s infinite alternate;
        }

        @keyframes glow {
            0% { box-shadow: 0 0 10px #ffcd3c; }
            100% { box-shadow: 0 0 25px #ff2d55; }
        }

        @media (max-width: 450px) {
            .card { padding: 25px; }
            h1 { font-size: 30px; }
            p { font-size: 16px; }
            a { font-size: 18px; padding: 12px 22px; }
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>Pan Parówka</h1>
        <p>Ze mną dojdziesz do sukcesu! 💪🏽<br>
        Nauczę cię prostych ciekawostek, które na pewno przydadzą Ci się w przyszłości! 😎</p>
        <a href="https://www.sklejdupe.com" target="_blank">Przejdź do linku</a>
    </div>
</body>
</html>
